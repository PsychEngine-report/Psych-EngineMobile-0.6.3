name: Mobile + Release
on: workflow_dispatch

permissions: write-all   # ✅ caller must allow write perms too

env:
  PROJECT_NAME: PsychEngine
  REPO_PATH: PsychEngine-report/Psych-EngineMobile-0.6.3

jobs:
  get-commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
    steps:
      - name: Check Repository
        run: |
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "REPO_PATH: ${{ env.REPO_PATH }}"
          if [[ "$GITHUB_REPOSITORY" != "${{ env.REPO_PATH }}" ]]; then
            echo "Doesn't seem to be correct, returning SIGABRT..."
            exit 6
          else
            echo "Seems to be correct..."
          fi

      - name: Get latest commit hash
        id: get_commit_hash
        run: |
          commit_hash=${GITHUB_SHA::7}
          echo "Latest commit hash is $commit_hash"
          echo "::set-output name=COMMIT_HASH::$commit_hash"

  build:
    name: ${{ matrix.name }}
    needs: get-commit-hash
    strategy:
      matrix:
        include:
          - name: Windows-PNG
            os: windows-latest
            buildArgs: "windows -final -D officialBuild"
            artifactName: windowsBuild-PNG
            artifactPath: export\release\windows\bin\*
          - name: Android-PNG
            os: ubuntu-22.04
            buildArgs: "android -final -D officialBuild"
            artifactName: androidBuild-PNG
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: Android-ASTC
            os: ubuntu-22.04
            buildArgs: "android -final -D officialBuild -D USING_GPU_TEXTURES"
            artifactName: androidBuild-ASTC
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: iOS-PNG
            os: macos-15
            buildArgs: "ios -final -nosign -D officialBuild"
            artifactName: iOSBuild-PNG
            artifactPath: "export/release/ios/build/Release-iphoneos/PsychEngine.ipa"
          - name: iOS-ASTC
            os: macos-15
            buildArgs: "ios -final -nosign -D officialBuild -D USING_GPU_TEXTURES"
            artifactName: iOSBuild-ASTC
            artifactPath: "export/release/ios/build/Release-iphoneos/PsychEngine.ipa"
    uses: ./.github/workflows/build.yml
    with:
        name: ${{ matrix.name }}
        os: ${{ matrix.os }}
        buildArgs: ${{ matrix.buildArgs }}
        artifactName: ${{ matrix.artifactName }}
        artifactPath: ${{ matrix.artifactPath }}

  Releaser:
    needs: [get-commit-hash, build]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@main
        with:
          name: windowsBuild-PNG
          path: /home/runner/windowsBuild-PNG

      - name: Zip Windows Build For Release
        run: |
          cd /home/runner/windowsBuild-PNG
          zip -r "/home/runner/${{ env.PROJECT_NAME }}-Windows-PNG.zip" .
          
      - name: Download Android Build
        uses: actions/download-artifact@main
        with:
           name: androidBuild-PNG
           path: /home/runner

      - name: Move Android File
        run: mv /home/runner/${{ env.PROJECT_NAME }}-release.apk /home/runner/${{ env.PROJECT_NAME }}-png.apk

      - name: Download iOS Build
        uses: actions/download-artifact@main
        with:
           name: iOSBuild-PNG
           path: ${{ github.workspace }}

      - name: Move iOS File
        run: mv ${{ github.workspace }}/${{ env.PROJECT_NAME }}.ipa /home/runner/${{ env.PROJECT_NAME }}-png.ipa

      - name: Download Android Build
        uses: actions/download-artifact@main
        with:
           name: androidBuild-ASTC
           path: /home/runner

      - name: Move Android File
        run: mv /home/runner/${{ env.PROJECT_NAME }}-release.apk /home/runner/${{ env.PROJECT_NAME }}-Android-astc.apk

      - name: Download iOS Build
        uses: actions/download-artifact@main
        with:
           name: iOSBuild-ASTC
           path: ${{ github.workspace }}

      - name: Move iOS File
        run: mv ${{ github.workspace }}/${{ env.PROJECT_NAME }}.ipa /home/runner/${{ env.PROJECT_NAME }}-astc.ipa

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HOTIFX 0.71 (V${{ needs.get-commit-hash.outputs.commit_hash }})"
          tag_name: "release-${{ needs.get-commit-hash.outputs.commit_hash }}"
          make_latest: true
          files: |
            /home/runner/*-Windows-PNG.apk
            /home/runner/*-png.ipa
            /home/runner/*-astc.apk
            /home/runner/*-astc.ipa
            /home/runner/*-png.zip
